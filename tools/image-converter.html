<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Image Format Converter — Call Your Son</title>
<link rel="stylesheet" href="../assets/css/style.css" />
<style>
  .preview-grid { display: grid; gap: 18px; grid-template-columns: 1fr 1fr; margin-top: 12px; }
  @media(max-width:700px) { .preview-grid { grid-template-columns: 1fr; } }
  .preview-card { background: var(--surface-2); border: 2px solid var(--border); border-radius: var(--radius-lg); padding: 16px; text-align: center; }
  .preview-card h3 { margin-top: 0; }
  .preview-card img { max-height: 240px; margin: 0 auto; border-radius: 8px; border: 1px solid var(--border); }
  .stat { font-size: 16px; color: var(--ink-soft); margin: 6px 0 0; }
</style>
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="../index.html" data-i18n="back">← Back to all tools</a>
  </header>

  <main class="container">
    <h1 data-i18n="tile-imgconv-title">Image Format Converter</h1>
    <p class="subtitle" data-i18n="imgconv-subtitle">Convert any photo between JPG, PNG, and WebP.</p>

    <section class="panel step" data-step="1">
      <h2 data-i18n="step-add-imgconv">Add your photo</h2>
      <div class="dropzone" tabindex="0" role="button" aria-label="Pick a photo">
        <div class="big" data-i18n="drop-imgconv-big">Drop a photo here</div>
        <div class="small" data-i18n="drop-imgconv-small">…or click to choose one</div>
        <input type="file" id="fileInput" accept="image/*" />
      </div>
    </section>

    <section class="panel step" data-step="2">
      <h2 data-i18n="step-pick-format">Pick the output format</h2>
      <div class="row">
        <div>
          <label for="outFormat" data-i18n="label-out-format">Save as</label>
          <select id="outFormat">
            <option value="image/jpeg">JPG</option>
            <option value="image/png">PNG</option>
            <option value="image/webp">WebP</option>
          </select>
        </div>
        <div id="qualityWrap">
          <label for="quality"><span data-i18n="label-quality">Quality</span>: <span id="qualityLabel">90</span>%</label>
          <input type="range" id="quality" min="40" max="100" step="5" value="90" />
        </div>
      </div>
    </section>

    <section class="panel step" data-step="3">
      <h2 data-i18n="step-compare">Compare and download</h2>
      <div class="preview-grid">
        <div class="preview-card">
          <h3 data-i18n="before">Before</h3>
          <img id="origImg" alt="" />
          <p class="stat" id="origStat">—</p>
        </div>
        <div class="preview-card">
          <h3 data-i18n="after">After</h3>
          <img id="newImg" alt="" />
          <p class="stat" id="newStat">—</p>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary btn-block" id="downloadBtn" disabled data-i18n="btn-dl-converted">⬇ Download converted photo</button>
      </div>
      <div id="banner" class="banner hidden" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/shared.js"></script>
  <script>
    var fileInput = document.getElementById('fileInput');
    var outFormat = document.getElementById('outFormat');
    var quality = document.getElementById('quality');
    var qualityLabel = document.getElementById('qualityLabel');
    var qualityWrap = document.getElementById('qualityWrap');
    var origImg = document.getElementById('origImg');
    var newImg = document.getElementById('newImg');
    var origStat = document.getElementById('origStat');
    var newStat = document.getElementById('newStat');
    var downloadBtn = document.getElementById('downloadBtn');
    var banner = document.getElementById('banner');

    var originalFile = null;
    var originalImage = null;
    var outputBlob = null;
    var regenTimer = null;

    outFormat.addEventListener('change', function() {
      qualityWrap.style.display = outFormat.value === 'image/png' ? 'none' : '';
      regenerate();
    });
    quality.addEventListener('input', function() {
      qualityLabel.textContent = quality.value;
      regenerate();
    });

    fileInput.addEventListener('change', function() {
      Helpers.clearBanner(banner);
      var f = fileInput.files && fileInput.files[0];
      if (!f) return;
      if (!f.type.startsWith('image/')) {
        Helpers.banner(banner, 'warn', 'Please pick an image file.');
        return;
      }
      originalFile = f;
      var url = URL.createObjectURL(f);
      origImg.src = url;
      var img = new Image();
      img.onload = function() {
        originalImage = img;
        origStat.textContent = img.width + ' × ' + img.height + ' px • ' + Helpers.formatBytes(f.size);
        regenerate();
      };
      img.src = url;
    });

    function regenerate() {
      if (!originalImage) return;
      clearTimeout(regenTimer);
      regenTimer = setTimeout(doConvert, 80);
    }

    function doConvert() {
      if (!originalImage) return;
      var fmt = outFormat.value;
      var q = parseInt(quality.value, 10) / 100;
      var canvas = document.createElement('canvas');
      canvas.width = originalImage.width;
      canvas.height = originalImage.height;
      var ctx = canvas.getContext('2d');
      if (fmt === 'image/jpeg') {
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      ctx.drawImage(originalImage, 0, 0);
      canvas.toBlob(function(blob) {
        if (!blob) return;
        outputBlob = blob;
        if (newImg.dataset.url) URL.revokeObjectURL(newImg.dataset.url);
        var url = URL.createObjectURL(blob);
        newImg.dataset.url = url;
        newImg.src = url;
        var ext = fmt === 'image/jpeg' ? 'JPG' : fmt === 'image/png' ? 'PNG' : 'WebP';
        newStat.textContent = originalImage.width + ' × ' + originalImage.height + ' px • ' + ext + ' • ' + Helpers.formatBytes(blob.size);
        downloadBtn.disabled = false;
      }, fmt, fmt === 'image/png' ? 1 : q);
    }

    downloadBtn.addEventListener('click', function() {
      if (!outputBlob || !originalFile) return;
      var exts = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' };
      var ext = exts[outFormat.value] || 'jpg';
      var base = originalFile.name.replace(/\.[^.]+$/, '');
      Helpers.download(outputBlob, base + '.' + ext);
    });
  </script>
</body>
</html>

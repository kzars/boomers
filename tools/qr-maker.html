<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QR Code Maker — Call Your Son</title>
<link rel="stylesheet" href="../assets/css/style.css" />
<style>
  .qr-wrap { display:grid; place-items:center; padding:24px 0; background:var(--surface-2); border-radius:var(--radius-lg); border:2px solid var(--border); }
  #qrcode { background:#fff; padding:16px; border-radius:12px; }
  #qrcode canvas { display:block; }
</style>
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="../index.html" data-i18n="back">← Back to all tools</a>
  </header>

  <main class="container">
    <h1 data-i18n="tile-qr-title">QR Code Maker</h1>
    <p class="subtitle" data-i18n="qr-subtitle">Make a QR code for a website, your Wi-Fi password, or any text.</p>

    <section class="panel step" data-step="1">
      <h2 data-i18n="step-qr-type">What kind of QR code?</h2>
      <div class="btn-row" role="tablist">
        <button class="btn btn-primary" id="modeText" role="tab" aria-selected="true" data-i18n="btn-qr-text">📝 Text or web link</button>
        <button class="btn btn-secondary" id="modeWifi" role="tab" aria-selected="false" data-i18n="btn-qr-wifi">📶 Wi-Fi</button>
      </div>

      <div id="paneText" style="margin-top:18px">
        <label for="text" data-i18n="label-text-url">Text or web address (URL)</label>
        <input type="text" id="text" placeholder="https://example.com" />
      </div>

      <div id="paneWifi" class="hidden" style="margin-top:18px">
        <div class="row">
          <div>
            <label for="ssid" data-i18n="label-ssid">Network name (SSID)</label>
            <input type="text" id="ssid" placeholder="MyHomeWiFi" />
          </div>
          <div>
            <label for="encType" data-i18n="label-security">Security</label>
            <select id="encType">
              <option value="WPA">WPA / WPA2 / WPA3</option>
              <option value="WEP">WEP</option>
              <option value="nopass">No password</option>
            </select>
          </div>
        </div>
        <label for="pass" style="margin-top:14px" data-i18n="label-wifi-pass">Password</label>
        <input type="text" id="pass" data-i18n-ph="ph-wifi-pass" placeholder="(leave empty if open network)" />
      </div>
    </section>

    <section class="panel step" data-step="2">
      <h2 data-i18n="step-qr-result">Your QR code</h2>
      <div class="qr-wrap">
        <div id="qrcode"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="downloadBtn" disabled data-i18n="btn-dl-qr">⬇ Download PNG</button>
      </div>
      <div id="banner" class="banner hidden" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/shared.js"></script>
  <script>
    var modeTextBtn = document.getElementById("modeText");
    var modeWifiBtn = document.getElementById("modeWifi");
    var paneText = document.getElementById("paneText");
    var paneWifi = document.getElementById("paneWifi");
    var text = document.getElementById("text");
    var ssid = document.getElementById("ssid");
    var pass = document.getElementById("pass");
    var encType = document.getElementById("encType");
    var qrcode = document.getElementById("qrcode");
    var downloadBtn = document.getElementById("downloadBtn");
    var banner = document.getElementById("banner");
    var mode = "text";
    var lastDataUrl = null;

    function setMode(m) {
      mode = m;
      var t = m === "text";
      modeTextBtn.className = "btn " + (t ? "btn-primary" : "btn-secondary");
      modeWifiBtn.className = "btn " + (t ? "btn-secondary" : "btn-primary");
      modeTextBtn.setAttribute("aria-selected", t);
      modeWifiBtn.setAttribute("aria-selected", !t);
      paneText.classList.toggle("hidden", !t);
      paneWifi.classList.toggle("hidden", t);
      render();
    }
    modeTextBtn.addEventListener("click", function() { setMode("text"); });
    modeWifiBtn.addEventListener("click", function() { setMode("wifi"); });

    function escapeWifi(s) { return (s || "").replace(/([\\;,:"])/g, "\\$1"); }
    function payload() {
      if (mode === "text") return text.value || "";
      if (!ssid.value) return "";
      var auth = encType.value === "nopass" ? "nopass" : encType.value;
      var p = encType.value === "nopass" ? "" : escapeWifi(pass.value);
      return "WIFI:T:" + auth + ";S:" + escapeWifi(ssid.value) + ";P:" + p + ";;";
    }

    function render() {
      Helpers.clearBanner(banner);
      var data = payload();
      qrcode.innerHTML = "";
      if (!data) { downloadBtn.disabled = true; return; }
      var canvas = document.createElement("canvas");
      QRCode.toCanvas(canvas, data, {
        width: 320, margin: 2,
        color: { dark: "#1F2A37", light: "#FFFFFF" },
        errorCorrectionLevel: "M",
      }, function(err) {
        if (err) {
          Helpers.banner(banner, "error", "Couldn't make a QR code from that. Try shorter text.");
          downloadBtn.disabled = true;
          return;
        }
        qrcode.appendChild(canvas);
        lastDataUrl = canvas.toDataURL("image/png");
        downloadBtn.disabled = false;
      });
    }

    [text, ssid, pass].forEach(function(el) { el.addEventListener("input", render); });
    encType.addEventListener("change", render);

    downloadBtn.addEventListener("click", function() {
      if (!lastDataUrl) return;
      var a = document.createElement("a");
      a.href = lastDataUrl;
      a.download = "qr-code.png";
      a.click();
    });

    text.value = "https://example.com";
    render();
  </script>
</body>
</html>

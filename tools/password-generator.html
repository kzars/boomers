<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Password Generator — Call Your Son</title>
<link rel="stylesheet" href="../assets/css/style.css" />
<style>
  .pwd-output {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: clamp(18px, 3vw, 26px);
    letter-spacing: 0.05em;
    background: var(--surface-2);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    word-break: break-all;
    min-height: 64px;
    display: flex;
    align-items: center;
    margin: 12px 0;
    color: var(--ink);
  }
  .strength-bar { height: 10px; border-radius: 999px; transition: width 200ms, background 200ms; background: var(--border); width: 0%; }
  .strength-wrap { background: var(--surface-2); border-radius: 999px; height: 10px; margin: 8px 0 4px; }
  .check-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .check-row label { font-weight: 400; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .check-row input[type=checkbox] { width: 22px; height: 22px; min-height: auto; accent-color: var(--accent); cursor: pointer; }
</style>
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="../index.html" data-i18n="back">← Back to all tools</a>
  </header>

  <main class="container">
    <h1 data-i18n="tile-pwd-title">Password Generator</h1>
    <p class="subtitle" data-i18n="pwd-subtitle">Generate a strong, random password — instantly.</p>

    <section class="panel step" data-step="1">
      <h2 data-i18n="step-pwd-options">Password options</h2>
      <div>
        <label for="pwdLength" data-i18n="label-pwd-length">Length</label>
        <input type="range" id="pwdLength" min="8" max="32" step="1" value="16" />
        <div style="text-align:center;font-size:22px;font-weight:800;margin:-4px 0 8px" id="pwdLengthLabel">16</div>
      </div>
      <div class="check-row">
        <label><input type="checkbox" id="incUpper" checked /><span data-i18n="opt-include-upper">Uppercase letters (A–Z)</span></label>
        <label><input type="checkbox" id="incLower" checked /><span data-i18n="opt-include-lower">Lowercase letters (a–z)</span></label>
        <label><input type="checkbox" id="incNums"  checked /><span data-i18n="opt-include-nums">Numbers (0–9)</span></label>
        <label><input type="checkbox" id="incSyms"  checked /><span data-i18n="opt-include-syms">Symbols (!@#…)</span></label>
      </div>
    </section>

    <section class="panel step" data-step="2">
      <h2 data-i18n="result-label">Result</h2>
      <div class="pwd-output" id="pwdOutput" aria-live="polite">—</div>
      <div class="strength-wrap"><div class="strength-bar" id="strengthBar"></div></div>
      <p style="margin:0;font-size:15px;color:var(--ink-soft)"><span data-i18n="pwd-strength">Strength</span>: <strong id="strengthLabel">—</strong></p>
      <div class="btn-row" style="margin-top:14px">
        <button class="btn btn-primary" id="genBtn" data-i18n="btn-gen-pwd">🔄 Generate</button>
        <button class="btn btn-secondary" id="copyBtn" data-i18n="btn-copy-pwd">📋 Copy</button>
      </div>
      <div id="banner" class="banner hidden" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/shared.js"></script>
  <script>
    var pwdLength = document.getElementById('pwdLength');
    var pwdLengthLabel = document.getElementById('pwdLengthLabel');
    var pwdOutput = document.getElementById('pwdOutput');
    var strengthBar = document.getElementById('strengthBar');
    var strengthLabel = document.getElementById('strengthLabel');
    var genBtn = document.getElementById('genBtn');
    var copyBtn = document.getElementById('copyBtn');
    var banner = document.getElementById('banner');

    var UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    var LOWER = 'abcdefghijklmnopqrstuvwxyz';
    var NUMS  = '0123456789';
    var SYMS  = '!@#$%^&*()-_=+[]{}|;:,.<>?';

    pwdLength.addEventListener('input', function() {
      pwdLengthLabel.textContent = pwdLength.value;
      generate();
    });

    ['incUpper','incLower','incNums','incSyms'].forEach(function(id) {
      document.getElementById(id).addEventListener('change', generate);
    });

    function generate() {
      Helpers.clearBanner(banner);
      var len = parseInt(pwdLength.value, 10);
      var charset = '';
      var required = [];
      if (document.getElementById('incUpper').checked) { charset += UPPER; required.push(UPPER); }
      if (document.getElementById('incLower').checked) { charset += LOWER; required.push(LOWER); }
      if (document.getElementById('incNums').checked)  { charset += NUMS;  required.push(NUMS); }
      if (document.getElementById('incSyms').checked)  { charset += SYMS;  required.push(SYMS); }
      if (!charset) {
        pwdOutput.textContent = '—';
        return;
      }
      var arr = new Uint32Array(len + required.length);
      crypto.getRandomValues(arr);
      var pwd = [];
      required.forEach(function(cs, i) {
        pwd.push(cs[arr[i] % cs.length]);
      });
      for (var i = required.length; i < len; i++) {
        pwd.push(charset[arr[i] % charset.length]);
      }
      // Shuffle
      for (var j = pwd.length - 1; j > 0; j--) {
        var k = arr[j] % (j + 1);
        var tmp = pwd[j]; pwd[j] = pwd[k]; pwd[k] = tmp;
      }
      var password = pwd.join('');
      pwdOutput.textContent = password;
      updateStrength(password);
    }

    function updateStrength(pwd) {
      var score = 0;
      if (pwd.length >= 12) score++;
      if (pwd.length >= 16) score++;
      if (/[A-Z]/.test(pwd)) score++;
      if (/[a-z]/.test(pwd)) score++;
      if (/[0-9]/.test(pwd)) score++;
      if (/[^A-Za-z0-9]/.test(pwd)) score++;
      var T = window.T || {};
      var levels = [
        { min: 0, max: 2, key: 'pwd-weak',      pct: 25,  color: '#B91C1C' },
        { min: 2, max: 4, key: 'pwd-fair',      pct: 50,  color: '#D97706' },
        { min: 4, max: 5, key: 'pwd-strong',    pct: 75,  color: '#15803D' },
        { min: 5, max: 7, key: 'pwd-very-strong', pct: 100, color: '#065F46' },
      ];
      var level = levels[0];
      for (var i = 0; i < levels.length; i++) {
        if (score >= levels[i].min) level = levels[i];
      }
      strengthBar.style.width = level.pct + '%';
      strengthBar.style.background = level.color;
      strengthLabel.textContent = T[level.key] || level.key;
      strengthLabel.style.color = level.color;
    }

    copyBtn.addEventListener('click', function() {
      var pwd = pwdOutput.textContent;
      if (!pwd || pwd === '—') return;
      navigator.clipboard.writeText(pwd).then(function() {
        var T = window.T || {};
        Helpers.banner(banner, 'success', T['pwd-copied'] || 'Copied!');
        setTimeout(function() { Helpers.clearBanner(banner); }, 2000);
      });
    });

    genBtn.addEventListener('click', generate);
    generate();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Read Aloud — Easy Tools</title>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="../index.html" data-i18n="back">← Back to all tools</a>
  </header>

  <main class="container">
    <h1 data-i18n="tile-read-title">Read Aloud</h1>
    <p class="subtitle" data-i18n="ral-subtitle">Paste any text and have your computer read it to you out loud.</p>

    <section class="panel step" data-step="1">
      <h2 data-i18n="step-paste-text">Paste your text</h2>
      <label for="text" class="muted" data-i18n="step-paste-note">Type or paste anything — an article, an email, a story.</label>
      <textarea id="text" data-i18n-ph="ph-paste-here" placeholder="Paste here…"></textarea>
    </section>

    <section class="panel step" data-step="2">
      <h2 data-i18n="step-settings">Settings</h2>
      <div class="row">
        <div>
          <label for="voice" data-i18n="label-voice">Voice</label>
          <select id="voice"></select>
        </div>
        <div>
          <label for="rate"><span data-i18n="label-speed">Speed</span>: <span id="rateLabel" data-i18n="speed-normal">Normal</span></label>
          <input type="range" id="rate" min="0.5" max="1.6" step="0.1" value="1" />
        </div>
      </div>
    </section>

    <section class="panel step" data-step="3">
      <h2 data-i18n="step-listen">Listen</h2>
      <div class="btn-row">
        <button class="btn btn-primary" id="playBtn" data-i18n="btn-play">▶ Play</button>
        <button class="btn btn-secondary" id="pauseBtn" disabled data-i18n="btn-pause">⏸ Pause</button>
        <button class="btn btn-secondary" id="resumeBtn" disabled data-i18n="btn-resume">⏵ Resume</button>
        <button class="btn btn-danger" id="stopBtn" disabled data-i18n="btn-stop">⏹ Stop</button>
      </div>
      <div id="banner" class="banner hidden" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/shared.js"></script>
  <script>
    var synth = window.speechSynthesis;
    var text = document.getElementById("text");
    var voiceSel = document.getElementById("voice");
    var rate = document.getElementById("rate");
    var rateLabel = document.getElementById("rateLabel");
    var playBtn = document.getElementById("playBtn");
    var pauseBtn = document.getElementById("pauseBtn");
    var resumeBtn = document.getElementById("resumeBtn");
    var stopBtn = document.getElementById("stopBtn");
    var banner = document.getElementById("banner");

    if (!synth) {
      Helpers.banner(banner, "error", "Sorry — your browser doesn't support reading aloud. Try Chrome, Edge, or Safari.");
      [playBtn, pauseBtn, resumeBtn, stopBtn].forEach(function(b) { b.disabled = true; });
    }

    var voices = [];
    function loadVoices() {
      voices = synth.getVoices();
      var ranked = voices.map(function(v, i) { return { v: v, i: i }; }).sort(function(a, b) {
        var ae = a.v.lang.toLowerCase().startsWith("en") ? 0 : 1;
        var be = b.v.lang.toLowerCase().startsWith("en") ? 0 : 1;
        return ae - be || a.i - b.i;
      });
      voiceSel.innerHTML = "";
      ranked.forEach(function(r) {
        var opt = document.createElement("option");
        opt.value = r.i;
        opt.textContent = r.v.name + "  (" + r.v.lang + ")";
        voiceSel.appendChild(opt);
      });
    }
    if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }

    rate.addEventListener("input", function() {
      var r = parseFloat(rate.value);
      var T = window.T || {};
      rateLabel.textContent = r < 0.85 ? (T['speed-slower'] || 'Slower') : r > 1.15 ? (T['speed-faster'] || 'Faster') : (T['speed-normal'] || 'Normal');
    });

    function setPlayingUI(playing, paused) {
      playBtn.disabled = playing && !paused;
      pauseBtn.disabled = !playing || paused;
      resumeBtn.disabled = !paused;
      stopBtn.disabled = !playing;
    }

    playBtn.addEventListener("click", function() {
      Helpers.clearBanner(banner);
      var txt = (text.value || "").trim();
      if (!txt) { Helpers.banner(banner, "warn", "Please paste some text first."); return; }
      synth.cancel();
      var utt = new SpeechSynthesisUtterance(txt);
      var i = parseInt(voiceSel.value, 10);
      if (!Number.isNaN(i) && voices[i]) utt.voice = voices[i];
      utt.rate = parseFloat(rate.value);
      utt.onend = function() { setPlayingUI(false, false); };
      utt.onerror = function() { setPlayingUI(false, false); };
      synth.speak(utt);
      setPlayingUI(true, false);
    });
    pauseBtn.addEventListener("click", function() { synth.pause(); setPlayingUI(true, true); });
    resumeBtn.addEventListener("click", function() { synth.resume(); setPlayingUI(true, false); });
    stopBtn.addEventListener("click", function() { synth.cancel(); setPlayingUI(false, false); });
    window.addEventListener("pagehide", function() { synth && synth.cancel(); });
  </script>
</body>
</html>

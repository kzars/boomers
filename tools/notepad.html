<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Notepad — Call Your Son</title>
<link rel="stylesheet" href="../assets/css/style.css" />
<style>
  #noteArea {
    min-height: 320px;
    font-size: 19px;
    line-height: 1.6;
    resize: vertical;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .save-row { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
  #savedMsg { color: var(--success); font-weight: 700; font-size: 16px; opacity: 0; transition: opacity 600ms; }
  #savedMsg.show { opacity: 1; }
</style>
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="../index.html" data-i18n="back">← Back to all tools</a>
  </header>

  <main class="container">
    <h1 data-i18n="tile-note-title">Notepad</h1>
    <p class="subtitle" data-i18n="note-subtitle">Quick notes — saved automatically in your browser.</p>

    <section class="panel step" data-step="1">
      <h2 data-i18n="step-your-notes">Your notes</h2>
      <textarea id="noteArea" data-i18n-ph="ph-notes" placeholder="Start typing…"></textarea>
      <div class="save-row">
        <span id="savedMsg" data-i18n="note-saved">Saved.</span>
        <button class="btn btn-danger" id="clearBtn" style="margin-left:auto" data-i18n="btn-clear-notes">Clear all</button>
      </div>
    </section>
  </main>

  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/shared.js"></script>
  <script>
    var STORAGE_KEY = 'cys-notepad';
    var noteArea = document.getElementById('noteArea');
    var savedMsg = document.getElementById('savedMsg');
    var clearBtn = document.getElementById('clearBtn');
    var saveTimer = null;
    var flashTimer = null;

    noteArea.value = localStorage.getItem(STORAGE_KEY) || '';

    function save() {
      try { localStorage.setItem(STORAGE_KEY, noteArea.value); } catch(e) {}
      savedMsg.classList.add('show');
      clearTimeout(flashTimer);
      flashTimer = setTimeout(function() { savedMsg.classList.remove('show'); }, 1800);
    }

    noteArea.addEventListener('input', function() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 600);
    });

    clearBtn.addEventListener('click', function() {
      var T = window.T || {};
      var msg = T['note-clear-confirm'] || 'Delete all notes? This cannot be undone.';
      if (!confirm(msg)) return;
      noteArea.value = '';
      try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
      savedMsg.classList.remove('show');
    });
  </script>
</body>
</html>

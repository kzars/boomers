<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Photos → PDF — Easy Tools</title>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="../index.html">← Back to all tools</a>
  </header>

  <main class="container">
    <h1>Photos → PDF</h1>
    <p class="subtitle">Combine your photos into one PDF, in the order you choose.</p>

    <section class="panel step" data-step="1">
      <h2>Add your photos</h2>
      <div class="dropzone" tabindex="0" role="button" aria-label="Add photos">
        <div class="big">Drop photos here</div>
        <div class="small">…or click to pick photos from your computer (you can pick more than one)</div>
        <input type="file" id="fileInput" accept="image/*" multiple />
      </div>
      <ul class="file-list" id="list"></ul>
    </section>

    <section class="panel step" data-step="2">
      <h2>Page settings</h2>
      <div class="row">
        <div>
          <label for="pageSize">Paper size</label>
          <select id="pageSize">
            <option value="letter">US Letter</option>
            <option value="a4">A4</option>
          </select>
        </div>
        <div>
          <label for="orient">Orientation</label>
          <select id="orient">
            <option value="p">Tall (portrait)</option>
            <option value="l">Wide (landscape)</option>
          </select>
        </div>
        <div>
          <label for="pdfName">File name</label>
          <input type="text" id="pdfName" value="my-photos" />
        </div>
      </div>
    </section>

    <section class="panel step" data-step="3">
      <h2>Make the PDF</h2>
      <button class="btn btn-primary btn-block" id="goBtn" disabled>📄 Make PDF</button>
      <div id="banner" class="banner hidden" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="../assets/js/shared.js"></script>
  <script>
    const fileInput = document.getElementById("fileInput");
    const list = document.getElementById("list");
    const goBtn = document.getElementById("goBtn");
    const banner = document.getElementById("banner");

    /** @type {{file: File, url: string}[]} */
    let items = [];

    function render() {
      list.innerHTML = "";
      items.forEach((it, i) => {
        const li = document.createElement("li");
        const img = document.createElement("img");
        img.className = "thumb";
        img.alt = "";
        img.src = it.url;
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = (i + 1) + ". " + it.file.name;
        const up = document.createElement("button");
        up.className = "icon-btn";
        up.title = "Move up";
        up.textContent = "↑";
        up.disabled = i === 0;
        up.addEventListener("click", () => { swap(i, i - 1); });
        const down = document.createElement("button");
        down.className = "icon-btn";
        down.title = "Move down";
        down.textContent = "↓";
        down.disabled = i === items.length - 1;
        down.addEventListener("click", () => { swap(i, i + 1); });
        const del = document.createElement("button");
        del.className = "icon-btn danger";
        del.title = "Remove";
        del.textContent = "✕";
        del.addEventListener("click", () => { remove(i); });
        li.append(img, name, up, down, del);
        list.appendChild(li);
      });
      goBtn.disabled = items.length === 0;
    }
    function swap(a, b) {
      [items[a], items[b]] = [items[b], items[a]];
      render();
    }
    function remove(i) {
      URL.revokeObjectURL(items[i].url);
      items.splice(i, 1);
      render();
    }

    fileInput.addEventListener("change", () => {
      const files = Array.from(fileInput.files || []).filter(f => f.type.startsWith("image/"));
      for (const f of files) items.push({ file: f, url: URL.createObjectURL(f) });
      fileInput.value = "";
      render();
    });

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    goBtn.addEventListener("click", async () => {
      Helpers.clearBanner(banner);
      goBtn.disabled = true;
      goBtn.textContent = "Working…";
      try {
        const { jsPDF } = window.jspdf;
        const orient = document.getElementById("orient").value;
        const fmt = document.getElementById("pageSize").value;
        const doc = new jsPDF({ unit: "pt", format: fmt, orientation: orient });
        const pw = doc.internal.pageSize.getWidth();
        const ph = doc.internal.pageSize.getHeight();
        const margin = 24;

        for (let i = 0; i < items.length; i++) {
          if (i > 0) doc.addPage();
          const img = await loadImage(items[i].url);
          const maxW = pw - margin * 2;
          const maxH = ph - margin * 2;
          const ratio = Math.min(maxW / img.width, maxH / img.height);
          const w = img.width * ratio;
          const h = img.height * ratio;
          const x = (pw - w) / 2;
          const y = (ph - h) / 2;
          // Use jsPDF's own URL-based add
          const fmtType = (items[i].file.type === "image/png") ? "PNG" : "JPEG";
          doc.addImage(img, fmtType, x, y, w, h);
        }
        const name = (document.getElementById("pdfName").value || "my-photos").replace(/\.pdf$/i, "");
        doc.save(name + ".pdf");
        Helpers.banner(banner, "success", "Done! Your PDF should be downloading now.");
      } catch (err) {
        Helpers.banner(banner, "error", err.message || "Something went wrong. Please try again.");
      } finally {
        goBtn.disabled = items.length === 0;
        goBtn.textContent = "📄 Make PDF";
      }
    });
  </script>
</body>
</html>

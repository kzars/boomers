<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tip & Bill Splitter — Call Your Son</title>
<link rel="stylesheet" href="../assets/css/style.css" />
<style>
  .tip-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .tip-buttons .btn { padding: 14px 18px; min-height: 56px; min-width: 80px; }
  .tip-buttons .btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tip-buttons .btn       { background: var(--surface); color: var(--ink); border: 2px solid var(--border-strong); }
</style>
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="../index.html" data-i18n="back">← Back to all tools</a>
  </header>

  <main class="container">
    <h1 data-i18n="tile-tip-title">Tip &amp; Bill Splitter</h1>
    <p class="subtitle" data-i18n="tip-subtitle">Quick tip math, with the bill split fairly among everyone.</p>

    <section class="panel step" data-step="1">
      <h2 data-i18n="step-bill">How much was the bill?</h2>
      <label for="bill" data-i18n="label-bill">Bill total ($)</label>
      <input type="number" id="bill" min="0" step="0.01" inputmode="decimal" placeholder="0.00" />
    </section>

    <section class="panel step" data-step="2">
      <h2 data-i18n="step-tip">How much tip?</h2>
      <div class="tip-buttons" id="tipBtns">
        <button class="btn" data-tip="10">10%</button>
        <button class="btn" data-tip="15">15%</button>
        <button class="btn active" data-tip="18">18%</button>
        <button class="btn" data-tip="20">20%</button>
        <button class="btn" data-tip="25">25%</button>
      </div>
      <div style="margin-top:14px">
        <label for="customTip" data-i18n="label-custom-tip">Or type a custom %</label>
        <input type="number" id="customTip" min="0" max="100" step="0.5" inputmode="decimal" data-i18n-ph="ph-custom-tip" placeholder="e.g. 22" />
      </div>
    </section>

    <section class="panel step" data-step="3">
      <h2 data-i18n="step-people">How many people are paying?</h2>
      <label for="people" data-i18n="label-people">Number of people</label>
      <input type="number" id="people" min="1" step="1" value="1" inputmode="numeric" />
    </section>

    <section class="panel">
      <p class="result-label" data-i18n="result-tip">Tip amount</p>
      <p class="big-result" id="tipOut">$0.00</p>
      <p class="result-label" data-i18n="result-total">Total bill (with tip)</p>
      <p class="big-result" id="totalOut">$0.00</p>
      <p class="result-label" data-i18n="result-each">Each person pays</p>
      <p class="big-result" id="eachOut">$0.00</p>
    </section>
  </main>

  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/shared.js"></script>
  <script>
    var bill = document.getElementById("bill");
    var customTip = document.getElementById("customTip");
    var people = document.getElementById("people");
    var tipBtns = document.getElementById("tipBtns");
    var tipOut = document.getElementById("tipOut");
    var totalOut = document.getElementById("totalOut");
    var eachOut = document.getElementById("eachOut");
    var tipPct = 18;

    function fmt(n) { return "$" + (Math.round(n * 100) / 100).toFixed(2); }
    function calc() {
      var b = parseFloat(bill.value) || 0;
      var p = Math.max(1, parseInt(people.value, 10) || 1);
      var tip = b * (tipPct / 100);
      var total = b + tip;
      tipOut.textContent = fmt(tip);
      totalOut.textContent = fmt(total);
      eachOut.textContent = fmt(total / p);
    }

    tipBtns.addEventListener("click", function(e) {
      var btn = e.target.closest("button[data-tip]");
      if (!btn) return;
      tipBtns.querySelectorAll(".btn").forEach(function(b) { b.classList.remove("active"); });
      btn.classList.add("active");
      tipPct = parseFloat(btn.dataset.tip);
      customTip.value = "";
      calc();
    });
    customTip.addEventListener("input", function() {
      var v = parseFloat(customTip.value);
      if (!Number.isNaN(v) && v >= 0) {
        tipPct = v;
        tipBtns.querySelectorAll(".btn").forEach(function(b) { b.classList.remove("active"); });
      }
      calc();
    });
    [bill, people].forEach(function(el) { el.addEventListener("input", calc); });
    calc();
  </script>
</body>
</html>

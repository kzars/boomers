<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Discount Calculator — Call Your Son</title>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="../index.html" data-i18n="back">← Back to all tools</a>
  </header>

  <main class="container">
    <h1 data-i18n="tile-disc-title">Discount Calculator</h1>
    <p class="subtitle" data-i18n="disc-subtitle">Find the sale price — and how much you save.</p>

    <section class="panel step" data-step="1">
      <h2 data-i18n="step-disc-price">Original price and discount</h2>
      <div class="row">
        <div>
          <label for="origPrice" data-i18n="label-orig-price">Original price</label>
          <input type="number" id="origPrice" min="0" step="0.01" value="80" />
        </div>
        <div>
          <label for="discPct" data-i18n="label-disc-pct">Discount (%)</label>
          <input type="number" id="discPct" min="0" max="100" step="1" value="30" />
        </div>
      </div>
    </section>

    <section class="panel step" data-step="2">
      <h2 data-i18n="result-label">Result</h2>
      <div class="row" style="margin-top:8px">
        <div class="center">
          <div class="big-result" id="salePrice">—</div>
          <div class="result-label" data-i18n="disc-sale-price">Sale price</div>
        </div>
        <div class="center">
          <div class="big-result" id="youSave">—</div>
          <div class="result-label" data-i18n="disc-you-save">You save</div>
        </div>
      </div>
      <div id="banner" class="banner hidden" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/shared.js"></script>
  <script>
    function calculate() {
      var price = parseFloat(document.getElementById('origPrice').value);
      var pct = parseFloat(document.getElementById('discPct').value);
      if (isNaN(price) || isNaN(pct)) return;
      var save = price * pct / 100;
      var sale = price - save;
      document.getElementById('salePrice').textContent = '$' + sale.toFixed(2);
      document.getElementById('youSave').textContent = '$' + save.toFixed(2);
    }
    ['origPrice', 'discPct'].forEach(function(id) {
      document.getElementById(id).addEventListener('input', calculate);
    });
    calculate();
  </script>
</body>
</html>

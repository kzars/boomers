<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scam Link Checker — Call Your Son</title>
<link rel="stylesheet" href="../assets/css/style.css" />
<style>
  .flag-list { list-style: none; padding: 0; margin: 10px 0 0; }
  .flag-list li { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 17px; }
  .flag-list li:first-child { border-top: none; }
  .flag-icon { font-size: 20px; flex-shrink: 0; }
</style>
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="../index.html" data-i18n="back">← Back to all tools</a>
  </header>

  <main class="container">
    <h1 data-i18n="tile-scam-title">Scam Link Checker</h1>
    <p class="subtitle" data-i18n="scam-subtitle">Paste a link or website address to check for warning signs.</p>

    <section class="panel step" data-step="1">
      <h2 data-i18n="step-scam-input">Paste the link</h2>
      <label for="urlInput" data-i18n="label-scam-url">Link or website address</label>
      <input type="url" id="urlInput" data-i18n-ph="ph-scam-url" placeholder="https://example.com" autocomplete="off" />
      <div class="btn-row">
        <button class="btn btn-primary" id="checkBtn" data-i18n="btn-check-scam">🔎 Check link</button>
      </div>
    </section>

    <section class="panel step" data-step="2" id="resultSection" style="display:none">
      <h2 data-i18n="result-label">Result</h2>
      <div id="resultBanner" class="banner" role="status" aria-live="polite"></div>
      <ul class="flag-list" id="flagList"></ul>
      <p class="muted" style="font-size:15px;margin-top:14px" data-i18n="scam-tip">This is not a guarantee of safety. If in doubt, do not click.</p>
    </section>
  </main>

  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/shared.js"></script>
  <script>
    var urlInput = document.getElementById('urlInput');
    var checkBtn = document.getElementById('checkBtn');
    var resultSection = document.getElementById('resultSection');
    var resultBanner = document.getElementById('resultBanner');
    var flagList = document.getElementById('flagList');

    var CHECKS = [
      {
        test: function(u, h, p) { return /^https:\/\//i.test(u); },
        good: true, msg: 'Uses secure HTTPS connection.'
      },
      {
        test: function(u, h, p) { return /^http:\/\//i.test(u); },
        good: false, msg: 'Uses insecure HTTP (not encrypted).'
      },
      {
        test: function(u, h, p) {
          return /bit\.ly|tinyurl\.com|t\.co|goo\.gl|ow\.ly|is\.gd|buff\.ly|short\.io|rb\.gy|cutt\.ly/i.test(h);
        },
        good: false, msg: 'Uses a link shortener — the real destination is hidden.'
      },
      {
        test: function(u, h, p) {
          return /[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/.test(h);
        },
        good: false, msg: 'Points to a raw IP address — legitimate sites use domain names.'
      },
      {
        test: function(u, h, p) {
          var suspicious = ['paypa1','paypai','amaz0n','micros0ft','g00gle','app1e','faceb00k','netfl1x'];
          return suspicious.some(function(s) { return h.indexOf(s) !== -1; });
        },
        good: false, msg: 'Domain looks like a misspelling of a well-known brand.'
      },
      {
        test: function(u, h, p) {
          var knownBrands = ['paypal','amazon','microsoft','google','apple','facebook','netflix','instagram'];
          return knownBrands.some(function(b) {
            return h.indexOf(b) !== -1 && !h.endsWith('.' + b + '.com') && !h.endsWith(b + '.com');
          });
        },
        good: false, msg: 'A big brand name is inside the URL but not the main domain.'
      },
      {
        test: function(u, h, p) { return h.split('.').length > 4; },
        good: false, msg: 'Unusually many sub-domains — common in phishing links.'
      },
      {
        test: function(u, h, p) {
          return /login|verify|confirm|update|secure|account|bank|signin|password/i.test(p);
        },
        good: false, msg: 'Path contains urgent-sounding words (login, verify, confirm…).'
      },
      {
        test: function(u, h, p) {
          var tlds = ['.xyz','.top','.click','.gq','.tk','.ml','.ga','.cf','.pw','.cc'];
          return tlds.some(function(t) { return h.endsWith(t); });
        },
        good: false, msg: 'Uses a free or unusual top-level domain often associated with scams.'
      },
    ];

    function check() {
      var raw = urlInput.value.trim();
      if (!raw) return;
      var url = raw;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      var hostname = '', path = '';
      try {
        var parsed = new URL(url);
        hostname = parsed.hostname.toLowerCase();
        path = parsed.pathname + parsed.search;
      } catch(e) {
        hostname = url.toLowerCase();
      }

      var flags = [];
      var goodCount = 0;
      CHECKS.forEach(function(c) {
        if (c.test(url, hostname, path)) {
          flags.push({ good: c.good, msg: c.msg });
          if (c.good) goodCount++;
        }
      });

      var badFlags = flags.filter(function(f) { return !f.good; });
      var T = window.T || {};

      resultSection.style.display = '';
      if (badFlags.length === 0) {
        resultBanner.className = 'banner success';
        resultBanner.textContent = '✅ ' + (T['scam-clean'] || 'Looks OK — no obvious warning signs found.');
      } else {
        resultBanner.className = 'banner error';
        resultBanner.textContent = '⚠️ ' + (T['scam-warning'] || 'Warning signs found — be careful!');
      }

      flagList.innerHTML = '';
      flags.forEach(function(f) {
        var li = document.createElement('li');
        li.innerHTML = '<span class="flag-icon">' + (f.good ? '✅' : '⚠️') + '</span><span>' + f.msg + '</span>';
        flagList.appendChild(li);
      });
      if (flags.length === 0) {
        var li = document.createElement('li');
        li.innerHTML = '<span class="flag-icon">ℹ️</span><span>No specific checks triggered.</span>';
        flagList.appendChild(li);
      }
    }

    checkBtn.addEventListener('click', check);
    urlInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') check(); });
  </script>
</body>
</html>
